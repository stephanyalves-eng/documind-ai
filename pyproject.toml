[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-ai"
version = "0.1.2"
description = "Local PDF extraction and evidence-grounded proposal comparison"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-only"
dependencies = ["PyMuPDF==2.1", "pydantic==2.14.4"]

[project.scripts]
documind = "documind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
documind = ["fields.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]
